name: AuthKit CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: authkit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure read-only design package access
        env:
          DESIGNTOKENSKIT_DEPLOY_KEY: ${{ secrets.DESIGNTOKENSKIT_DEPLOY_KEY }}
          UICOMPONENTSKIT_DEPLOY_KEY: ${{ secrets.UICOMPONENTSKIT_DEPLOY_KEY }}
        run: bash Scripts/configure-private-dependencies.sh
      - name: Select Xcode
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_27.1.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Enforce pinned SwiftLint and dependencies
        run: |
          bash Scripts/install-swiftlint.sh "$RUNNER_TEMP/swiftlint"
          SWIFTLINT_BIN="$RUNNER_TEMP/swiftlint/swiftlint" bash Scripts/lint.sh
          python3 Scripts/verify_pins.py
      - name: Unit tests
        run: swift test --force-resolved-versions --enable-code-coverage > "$RUNNER_TEMP/authkit-tests.log" 2>&1
      - name: Build iOS library and UI
        run: >-
          xcodebuild -scheme AuthKitUI -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/AuthKitDerived" -onlyUsePackageVersionsFromResolvedFile -disableAutomaticPackageResolution -scmProvider system
          CODE_SIGNING_ALLOWED=NO build
      - name: Test iOS package and render branded screens
        run: |
          device_id=$(xcrun simctl create "AuthKit CI" com.apple.CoreSimulator.SimDeviceType.iPhone-11 com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          xcodebuild -scheme AuthKit-Package -destination "platform=iOS Simulator,id=$device_id" -parallel-testing-enabled NO -derivedDataPath "$RUNNER_TEMP/AuthKitDerived" -resultBundlePath "$RUNNER_TEMP/AuthKitResults.xcresult" -onlyUsePackageVersionsFromResolvedFile -disableAutomaticPackageResolution -scmProvider system CODE_SIGNING_ALLOWED=NO test
      - name: Verify dependency resolution preserved the reviewed lockfile
        run: |
          python3 Scripts/verify_pins.py
          git diff --exit-code -- Package.resolved
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: authkit-validation
          path: |
            ${{ runner.temp }}/authkit-tests.log
            ${{ runner.temp }}/AuthKitResults.xcresult
      - name: Remove credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/shared-kit-credentials"
          echo "GIT_CONFIG_GLOBAL=/dev/null" >> "$GITHUB_ENV"
          echo "GIT_SSH_COMMAND=ssh" >> "$GITHUB_ENV"
